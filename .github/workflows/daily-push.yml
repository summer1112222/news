name: 每日新闻推送

on:
  schedule:
    # UTC 17:02 = 北京时间次日 01:02
    # GitHub cron 有几分钟抖动,故避开整点高峰
    - cron: '2 17 * * *'
  workflow_dispatch: {}   # 手动触发,方便首次测试

permissions:
  contents: read
  pages: write           # 部署 GitHub Pages 需要
  id-token: write        # deploy-pages 需要

jobs:
  push:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成 HTML + 推送微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          MAX_RESULTS: '10'
          MAX_DAYS: '30'           # 旧闻 cutoff 放宽到 30 天,避免分类国内空窗
          TOP_N: '10'              # 每类每地域最终展示 10 条
          SEARCH_INTERVAL: '3'     # 每次搜索间隔 3 秒,避免 anysearch 限流
        run: python scripts/build_digest.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 Pages
        id: deploy
        uses: actions/deploy-pages@v4
