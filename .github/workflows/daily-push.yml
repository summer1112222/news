name: 每日新闻推送

on:
  schedule:
    # 北京时间 04:02 抓取并推 Server酱 微信(每天一轮)
    # (GitHub cron 为 UTC = 北京-8;分钟错开整点避 cron 抖动高峰)
    # GitHub schedule 队列实测延迟 4~8.5 小时(消息实际 08:00~12:32 送达),
    # 故准点推送靠 Cloudflare Worker cron(北京 06:56 触发 dispatch,见 worker/),
    # 本 cron 仅作兜底:Worker 挂了/没配时,当天 8~12 点仍会送到。
    # 「今日已推则跳过」守卫保证两种触发并存时一天只推一条。
    - cron: '2 20 * * *'   # 北京 04:02 —— 兜底轮(准点轮由 Worker 触发 dispatch)
  workflow_dispatch: {}   # 手动触发/Worker 准点触发(等同全量轮,会推微信;不受查重守卫限制)

permissions:
  contents: write          # 小程序滚动数据 commit 回 main 需要(部署 Pages 之外的额外写权限)
  pages: write           # 部署 GitHub Pages 需要
  id-token: write        # deploy-pages 需要
  actions: read          # 查重守卫读本 workflow 今日运行记录需要

jobs:
  push:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 查重守卫(定时轮:今日已有成功轮次则跳过;dispatch 不受限)
        id: guard
        continue-on-error: true   # 查重失败宁可重复推送,不可让守卫失败漏掉当天的消息
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatch(人工或 Worker 准点),不查重"
            exit 0
          fi
          SINCE=$(TZ=Asia/Shanghai date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-push.yml/runs?per_page=50" \
                --jq "[.workflow_runs[] | select(.created_at >= \"$SINCE\" and .conclusion == \"success\")] | length")
          echo "今日(北京)已有成功轮次: $N"
          if [ "$N" -gt 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: '3.12'

      - name: 安装依赖
        if: steps.guard.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: 抓取并生成 HTML(仅全量轮推微信)
        if: steps.guard.outputs.skip != '1'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
          # 每天唯一一轮(北京 04:02 cron)或手动触发都带 PAGES_BASE_URL → 推微信
          PAGES_BASE_URL: ${{ (github.event_name != 'schedule' || github.event.schedule == '2 20 * * *') && secrets.PAGES_BASE_URL || '' }}
          # 昨日阅读统计(Cloudflare Worker /stats);secret 未配则页面/微信不显示该行
          STATS_READ_TOKEN: ${{ secrets.STATS_READ_TOKEN }}
          MAX_RESULTS: '10'
          MAX_DAYS: '30'           # 旧闻 cutoff 放宽到 30 天,避免分类国内空窗
          TOP_N: '10'              # 每类每地域最终展示 10 条
          SEARCH_INTERVAL: '3'     # 每次搜索间隔 3 秒,避免 anysearch 限流
        run: python scripts/build_digest.py

      - name: 上传 Pages 产物
        if: steps.guard.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 Pages
        if: steps.guard.outputs.skip != '1'
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 安装 Node
        if: steps.guard.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 部署到 Cloudflare Pages(主分享域名)
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true   # CF 部署失败不阻塞小程序上传;GitHub Pages 仍是兜底入口
        env:
          # wrangler 4.x:CF_API_TOKEN 环境变量已弃用,改用 CLOUDFLARE_API_TOKEN(secret 名不变)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ./public --project-name news-digest --commit-dirty=true

      - name: 小程序数据打包并上传体验版
        if: steps.guard.outputs.skip != '1'
        continue-on-error: true   # 上传失败不阻塞 Pages 部署成果,仅标黄告警
        env:
          MP_APPID: ${{ secrets.MP_APPID }}
          MP_UPLOAD_PRIVATE_KEY: ${{ secrets.MP_UPLOAD_PRIVATE_KEY }}
        run: |
          npm ci
          python scripts/build_mp_data.py
          node scripts/mp_upload.mjs

      - name: 提交小程序滚动数据回 main
        if: steps.guard.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniprogram/data miniprogram/packageHistory/data
          if git diff --cached --quiet; then
            echo "数据无变更,跳过提交"
          else
            git commit -m "chore: 小程序滚动数据更新"
            git pull --rebase origin main   # 抗竞态:run 期间 main 被人推过时先变基再推
            git push
          fi
